name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Um push novo no mesmo branch cancela a execucao anterior: sem isso, uma fila
# de pushes deixa runners ocupados validando codigo que ja foi substituido.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # O minimo declarado em pyproject.toml e o runtime de desenvolvimento.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # O frontend nao possui dependencias npm, mas a checagem de sintaxe exige
      # um runtime Node explicito em vez de depender da imagem do runner.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Testes
        # `-o addopts=""` para o resumo aparecer no log do CI: o addopts do
        # pyproject e `-q`, que esconde a contagem por arquivo.
        run: python -m pytest -o addopts="" -q

      - name: Byte-compile do backend
        run: python -m compileall -q backend/app

      - name: Sintaxe do frontend
        run: node --check static/app.js
