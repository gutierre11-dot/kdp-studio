[project]
name = "kdp-studio"
version = "1.0.0"
description = "Converta PDFs em EPUB no padrão KDP e traduza obras inteiras para português brasileiro."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pymupdf",
    "ebooklib",
    "python-multipart",
    "python-dotenv",
    "openai",
    "httpx",
    "pydantic",
    "lxml",
]
keywords = ["epub", "kdp", "pdf", "traducao", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: XML",
]

[project.urls]
Homepage = "https://github.com/gutierre11-dot/kdp-studio"
Repository = "https://github.com/gutierre11-dot/kdp-studio"
Issues = "https://github.com/gutierre11-dot/kdp-studio/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "acceptance: testes que exigem PDFs reais (KDP_REAL_PDFS_DIR)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Conjunto explicito de regras: o padrao do ruff muda entre versoes e uma
# regra nova ligada sozinha nao deve quebrar o CI sem ninguem mexer no codigo.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # O FastAPI exige `File(...)`/`Form(...)` como valor padrao do parametro:
    # e a assinatura da rota, nao um argumento mutavel por acidente.
    "B008",
]
