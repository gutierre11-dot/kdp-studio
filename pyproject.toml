[project]
name = "kdp-studio"
version = "1.0.0"
description = "Converta PDFs em EPUB no padrão KDP e traduza obras inteiras para português brasileiro."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pymupdf",
    "ebooklib",
    "python-multipart",
    "python-dotenv",
    "openai",
    "httpx",
    "pydantic",
    "lxml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "acceptance: testes que exigem PDFs reais (KDP_REAL_PDFS_DIR)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
