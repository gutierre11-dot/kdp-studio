[project]
name = "kdp-studio"
version = "1.0.0"
description = "Converta PDFs em eBooks EPUB/DOCX prontos para o KDP, traduza obras e crie livros com IA."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pymupdf",
    "ebooklib",
    "python-docx",
    "pillow",
    "python-multipart",
    "python-dotenv",
    "openai",
    "httpx",
    "pydantic",
    "lxml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
